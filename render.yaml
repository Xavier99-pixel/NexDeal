services:
  - type: web
    name: nexdeal
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install -g pnpm@10.23.0 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start -p $PORT
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_SITE_NAME
        value: NexDeal
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
